[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-crashlab"
version = "0.1.0"
description = "Reproducible worker-failure experiments for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crashlab = "crashlab.cli:main"

[tool.setuptools.package-data]
crashlab = ["static/*"]

[tool.setuptools.packages.find]
include = ["crashlab*"]
